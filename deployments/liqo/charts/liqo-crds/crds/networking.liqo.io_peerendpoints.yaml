---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: peerendpoints.networking.liqo.io
spec:
  group: networking.liqo.io
  names:
    categories:
    - liqo
    kind: PeerEndpoint
    listKind: PeerEndpointList
    plural: peerendpoints
    shortNames:
    - pe
    - peerep
    singular: peerendpoint
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          PeerEndpoint carries the endpoint of the remote gateway to the local gateway
          runtime. It is required by tunnel technologies that cannot discover the peer
          endpoint from the data plane, i.e. those configuring both sides statically
          (VXLAN in "static" tunnel mode) so that the outer source port can be hashed
          and RSS/ECMP can spread the tunnel traffic.

          It is watched by the gateway runtime, so the endpoint can be updated without
          restarting the gateway pod.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PeerEndpointSpec defines the desired state of PeerEndpoint.
            properties:
              endpoint:
                description: Endpoint specifies the endpoint at which the remote gateway
                  is reachable.
                properties:
                  addresses:
                    description: Addresses specifies the addresses of the endpoint.
                    items:
                      type: string
                    type: array
                  port:
                    description: Port specifies the port of the endpoint.
                    format: int32
                    type: integer
                  protocol:
                    description: Protocol specifies the protocol of the endpoint.
                    enum:
                    - TCP
                    - UDP
                    type: string
                type: object
            required:
            - endpoint
            type: object
        type: object
    served: true
    storage: true
